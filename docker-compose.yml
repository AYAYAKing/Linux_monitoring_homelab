services:
  ubuntu-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ubuntu-web:dev
    container_name: ubuntu-web
    stdin_open: true
    tty: true
    volumes:
      - ubuntu-web-data:/home/webuser/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubuntu-web-backend
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: ubuntu-web-nginx
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  ubuntu-web-data:
    name: ubuntu-web-data
